version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    maven-updates:
      applies-to: version-updates
      patterns:
        - "*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    github-actions-updates:
      applies-to: version-updates
      patterns:
        - "*"
